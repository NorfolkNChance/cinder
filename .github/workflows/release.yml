name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # required to create a GitHub Release and upload assets
  checks: read      # required to poll the CI check-run status before releasing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    environment: release   # optional: gate on manual approval
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # macos-latest runners are arm64, so `npm ci` only fetches the arm64
      # SQLCipher prebuilt. Building --x64 without the x64 binding present
      # packages the WRONG-arch binding into the x64 app, which then crashes on
      # launch ("Cannot find module … napi-v6-darwin-x64/node_sqlite3.node") —
      # exactly how v1.2.4 broke on every Mac. electron-builder's own
      # @electron/rebuild does NOT cross-fetch node-pre-gyp prebuilts, so we
      # fetch both arches explicitly here. Both bindings then ship inside each
      # app and SQLCipher resolves napi-v6-darwin-${process.arch} at runtime.
      # See ADR-0005 and CLAUDE.md "Known gotchas".
      - name: Fetch both-arch SQLCipher prebuilts
        run: |
          cd node_modules/@journeyapps/sqlcipher
          npx node-pre-gyp install --target_arch=arm64 --target_platform=darwin
          npx node-pre-gyp install --target_arch=x64   --target_platform=darwin
          echo "SQLCipher bindings present:"
          ls -1 lib/binding

      # ── CI gate ─────────────────────────────────────────────────────────────
      # Wait for the "validate" CI job to complete on this exact commit SHA
      # before we invest 45 minutes building, signing, and notarising.
      #
      # Polling loop: checks every 20 s for up to 6 minutes (18 attempts).
      # A typical CI run completes in ~1-2 min; the 6-min window handles any
      # runner queue delay. If CI fails, is cancelled, or never starts, the
      # release is aborted here rather than publishing a broken build.
      #
      # Note: `git push origin main --follow-tags` pushes the version-bump
      # commit and the tag simultaneously. GitHub triggers the CI workflow on
      # the commit push and this release workflow on the tag push at the same
      # moment, so a short wait is always needed.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          REPO="${{ github.repository }}"
          echo "Waiting for CI (validate job) to pass on $SHA …"

          for i in $(seq 1 18); do
            RESULT=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name == "validate")] |
                    if   length == 0                then "pending"
                    elif .[0].status != "completed" then "running"
                    else .[0].conclusion            end' 2>/dev/null \
              || echo "pending")

            echo "  attempt $i/18 — $RESULT"

            case "$RESULT" in
              success)
                echo "CI passed — proceeding with release."
                break
                ;;
              failure|cancelled|timed_out|action_required)
                echo "CI did not pass ($RESULT). Aborting release."
                exit 1
                ;;
              *)
                # pending / running / unexpected — keep waiting
                if [ "$i" -eq 18 ]; then
                  echo "CI did not complete within 6 minutes. Aborting release."
                  exit 1
                fi
                sleep 20
                ;;
            esac
          done

      # ── Build & publish ──────────────────────────────────────────────────────
      # Typecheck / lint / test are intentionally omitted here: the CI gate
      # above guarantees they already passed on this exact commit SHA. Running
      # them again would add ~2–3 minutes with zero safety benefit.
      - name: Compile (electron-vite)
        run: npm run build

      # Build BOTH arches in ONE invocation so electron-builder emits a single
      # combined latest-mac.yml describing both (electron-updater picks the
      # entry matching the client's arch). Publishing is decoupled to the next
      # step (--publish never) to avoid the parallel-create 422 race that the
      # old two-step approach suffered, and so artifact upload is a single
      # atomic gh call. Signing + notarisation still happen here (independent
      # of publish). Artifact names are arch-suffixed via electron-builder.yml.
      - name: Package, sign and notarise (x64 + arm64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64 --arm64 --publish never

      # Upload every artifact (both arch dmg + zip, their blockmaps, and the
      # single combined latest-mac.yml) to the GitHub Release for this tag in
      # one call. Idempotent: re-runs upload with --clobber instead of failing.
      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          ASSETS=(dist/Cinder-*.dmg dist/Cinder-*.zip dist/Cinder-*.blockmap dist/latest-mac.yml)
          echo "Publishing $TAG with assets:"
          printf '  %s\n' "${ASSETS[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --title "${TAG#v}" --generate-notes "${ASSETS[@]}"
          fi
