appId: com.cinder.app
productName: Cinder
directories:
  output: dist

files:
  - out/**/*
  - package.json

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # The CN of the Developer ID Application certificate (without the
  # "Developer ID Application: " prefix). electron-updater passes this to
  # ShipIt so it can verify the downloaded update's signing identity before
  # installation. Without it, ShipIt falls back to a bare identity comparison
  # that fails whenever the installed app and the update were signed in
  # different contexts (e.g. locally-built install → CI-signed update).
  publisherName: "James Burns (2R8J6YQMGN)"
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

afterSign: scripts/notarize.js

# Publish config — used by electron-updater to locate update metadata.
# Set GH_TOKEN (with repo write scope) in CI before running `npm run release`.
publish:
  provider: github
  releaseType: release
