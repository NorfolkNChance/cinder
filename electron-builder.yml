appId: com.cinder.app
productName: Cinder
directories:
  output: dist

files:
  - out/**/*
  - package.json

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

afterSign: scripts/notarize.js

# Publish config — used by electron-updater to locate update metadata.
# Set GH_TOKEN (with repo write scope) in CI before running `npm run release`.
publish:
  provider: github
  releaseType: release
